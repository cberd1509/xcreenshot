[package]
name = "xcreenshot"
description = "Fast, privacy-first screenshot tool"
authors = ["cberd1509"]
license = "MIT"
repository = "https://github.com/cberd1509/xcreenshot"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "xcreenshot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde = "1"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGDirectDisplay", "CGDisplayConfiguration", "CGWindow"] }

[dev-dependencies]
serde_json = "1"
