<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture overlay: ready to drag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #fafafa; background: #3f4b5e;">
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Desktop" hint-size="1440px,900px"></dc-import>
  </div>

  <!-- whole frozen frame dimmed until the user drags -->
  <div style="position: absolute; inset: 0; background: rgba(9, 9, 11, 0.45);"></div>

  <!-- full-height / full-width guides through the cursor -->
  <div style="position: absolute; left: 567px; top: 0; width: 1px; height: 900px; background: rgba(255, 255, 255, 0.35);"></div>
  <div style="position: absolute; left: 0; top: 337px; width: 1440px; height: 1px; background: rgba(255, 255, 255, 0.35);"></div>

  <!-- magnifier -->
  <div style="position: absolute; left: 592px; top: 352px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <div style="width: 120px; height: 120px; border-radius: 50%; overflow: hidden; position: relative; border: 2px solid #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.4); background: repeating-linear-gradient(0deg, transparent 0 11px, rgba(0,0,0,0.08) 11px 12px), repeating-linear-gradient(90deg, transparent 0 11px, rgba(0,0,0,0.08) 11px 12px), #ffffff;">
      <div style="position: absolute; left: 0; top: 60px; width: 120px; height: 36px; background: #f4f4f5;"></div>
      <div style="position: absolute; left: 0; top: 96px; width: 120px; height: 12px; background: #e4e4e7;"></div>
      <div style="position: absolute; left: 54px; top: 54px; width: 12px; height: 12px; box-sizing: border-box; border: 2px solid {{selection}};"></div>
    </div>
    <div style="padding: 3px 8px; border-radius: 6px; background: #18181b; border: 1px solid #27272a; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #e4e4e7;">567, 337 · #FFFFFF</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: center;">
    <div style="padding: 8px 14px; display: flex; gap: 16px; border-radius: 999px; background: rgba(24, 24, 27, 0.92); border: 1px solid #27272a; font-size: 12px; color: #a1a1aa;">
      <span><b style="color: #e4e4e7; font-weight: 600;">Drag</b> select area</span>
      <span><b style="color: #e4e4e7; font-weight: 600;">Esc</b> cancel</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selection":{"editor":"color","default":"#3B82F6"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { selection: this.props.selection ?? '#3B82F6' }; }
}
</script>
</body>
</html>
