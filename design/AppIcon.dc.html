<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App icon options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1240px; height: 960px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; background: #f4f4f5; font-family: Inter, system-ui, sans-serif; color: #09090b;">
  <sc-for list="{{options}}" as="o" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 16px; background: #ffffff; border: 1px solid #e4e4e7;">
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-size: 16px; font-weight: 700;">{{o.letter}}</span>
        <span style="font-size: 16px; font-weight: 600;">{{o.name}}</span>
        <span style="font-size: 12px; color: #71717a;">lucide/{{o.source}}</span>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 16px;">
        <svg role="img" aria-label="{{o.name}} icon" width="160" height="160" viewBox="0 0 256 256">
          <rect x="8" y="8" width="240" height="240" rx="56" fill="{{o.bg}}" stroke="{{o.border}}" stroke-width="2"></rect>
          <g transform="translate(56 56) scale(6)" fill="none" stroke="{{o.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <sc-for list="{{o.paths}}" as="d"><path d="{{d}}"></path></sc-for>
            <path d="{{o.accent}}" fill="{{o.accentColor}}" stroke="{{o.accentColor}}"></path>
          </g>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start;">
          <svg role="img" aria-label="{{o.name}} icon, 64 px" width="64" height="64" viewBox="0 0 256 256">
            <rect x="8" y="8" width="240" height="240" rx="56" fill="{{o.bg}}" stroke="{{o.border}}" stroke-width="4"></rect>
            <g transform="translate(56 56) scale(6)" fill="none" stroke="{{o.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <sc-for list="{{o.paths}}" as="d"><path d="{{d}}"></path></sc-for>
              <path d="{{o.accent}}" fill="{{o.accentColor}}" stroke="{{o.accentColor}}"></path>
            </g>
          </svg>
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg role="img" aria-label="{{o.name}} icon, 32 px" width="32" height="32" viewBox="0 0 256 256">
              <rect x="8" y="8" width="240" height="240" rx="56" fill="{{o.bg}}" stroke="{{o.border}}" stroke-width="8"></rect>
              <g transform="translate(56 56) scale(6)" fill="none" stroke="{{o.fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <sc-for list="{{o.paths}}" as="d"><path d="{{d}}"></path></sc-for>
                <path d="{{o.accent}}" fill="{{o.accentColor}}" stroke="{{o.accentColor}}"></path>
              </g>
            </svg>
            <div style="padding: 5px 8px; border-radius: 7px; background: #18181b; display: flex;">
              <svg role="img" aria-label="{{o.name}} menu bar icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <sc-for list="{{o.paths}}" as="d"><path d="{{d}}"></path></sc-for>
                <path d="{{o.accent}}" fill="#fafafa"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div style="font-size: 13px; line-height: 20px; color: #52525b;">{{o.note}}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3B82F6","options":["#3B82F6","#2563EB","#EF4444","#22C55E"]},"$preview":{"width":1240,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#3B82F6';
    const circle = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
    const corners = ['M3 7V5a2 2 0 0 1 2-2h2', 'M17 3h2a2 2 0 0 1 2 2v2', 'M21 17v2a2 2 0 0 1-2 2h-2', 'M7 21H5a2 2 0 0 1-2-2v-2'];
    const dashed = ['M5 3a2 2 0 0 0-2 2', 'M19 3a2 2 0 0 1 2 2', 'M5 21a2 2 0 0 1-2-2', 'M9 3h1', 'M9 21h2', 'M14 3h1', 'M3 9v1', 'M21 9v2', 'M3 14v1'];
    const pointer = 'M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z';
    const dark = '#18181b', white = '#ffffff';
    return {
      options: [
        { letter: 'A', name: 'Select', source: 'square-dashed-mouse-pointer', bg: dark, border: dark, fg: '#fafafa',
          paths: dashed, accent: pointer, accentColor: accent,
          note: 'Dashed selection with a blue cursor. Says exactly what the app does: drag to select.' },
        { letter: 'B', name: 'Crop', source: 'crop', bg: accent, border: accent, fg: white,
          paths: ['M6 2v14a2 2 0 0 0 2 2h14', 'M18 22V8a2 2 0 0 0-2-2H2'], accent: '', accentColor: 'none',
          note: 'Thin crop mark on blue. Light and familiar, very readable at small sizes.' },
        { letter: 'C', name: 'Focus', source: 'focus', bg: white, border: '#d4d4d8', fg: dark,
          paths: corners, accent: circle(12, 12, 3), accentColor: accent,
          note: 'Camera focus corners with a blue dot. Minimal and calm, like the Settings window.' },
        { letter: 'D', name: 'Aperture', source: 'aperture', bg: dark, border: dark, fg: '#fafafa',
          paths: [circle(12, 12, 10), 'm14.31 8 5.74 9.94', 'M9.69 8h11.48', 'm7.38 12 5.74-9.94', 'M9.69 16 3.95 6.06', 'M14.31 16H2.83', 'm16.62 12-5.74 9.94'],
          accent: '', accentColor: 'none',
          note: 'Camera shutter. Classic "capture" symbol, more photographic than tool-like.' },
        { letter: 'E', name: 'Cut', source: 'scissors-line-dashed', bg: accent, border: accent, fg: white,
          paths: ['M5.42 9.42 8 12', circle(4, 8, 2), 'm14 6-8.58 8.58', circle(4, 16, 2), 'M10.8 14.8 14 18', 'M16 12h-2', 'M22 12h-2'],
          accent: '', accentColor: 'none',
          note: 'Scissors cutting a dashed line, a nod to "snip". Playful, with a strong silhouette.' },
        { letter: 'F', name: 'Snap', source: 'scan + mouse pointer', bg: white, border: '#d4d4d8', fg: dark,
          paths: corners, accent: 'M9.034 9.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z', accentColor: accent,
          note: 'Focus corners with a blue cursor inside. A mix of A and C: clean, and still clearly a selection tool.' },
      ],
    };
  }
}
</script>
</body>
</html>
