<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirmation toasts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #fafafa; background: #3f4b5e;">
  <!-- the overlay is gone: the user's desktop, back in the app they were in -->
  <div style="position: absolute; left: 0; top: 0;">
    <dc-import name="Desktop" hint-size="1440px,900px"></dc-import>
  </div>

  <!-- Toasts: one small window that never takes focus, bottom center of the display the capture
       was on. Shown after every finished action (Copy, quick copy, Save, Share), with the system
       screenshot sound. Each fades out ~1.2 s after it appears. A new one goes at the bottom and
       pushes older ones up (dimmer); at most 3 are visible. The same action repeated while its
       toast is still up updates that toast with a count instead of adding another. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <sc-for list="{{toasts}}" as="t" hint-placeholder-count="3">
      <div role="status" style="{{t.style}}">
        <span style="width: 20px; height: 20px; border-radius: 50%; background: #fafafa; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#09090b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </span>
        <b style="color: #fafafa; font-weight: 600;">{{t.title}}</b>
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;">{{t.detail}}</span>
        <sc-if value="{{t.count}}" hint-placeholder-val="{{ false }}">
          <span style="padding: 1px 7px; border-radius: 999px; background: #3f3f46; color: #fafafa; font-size: 12px; font-weight: 600;">{{t.count}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["stacked","single"],"default":"stacked"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'padding: 8px 14px 8px 10px; display: flex; align-items: center; gap: 10px; border-radius: 999px; background: rgba(24, 24, 27, 0.94); border: 1px solid #27272a; box-shadow: 0 12px 32px rgba(0,0,0,0.35); font-size: 13px; color: #a1a1aa;';
    const all = [
      { title: 'Saved', detail: 'Screenshot 2026-11-06 at 23.12.png', count: '', style: base + ' opacity: 0.55; transform: scale(0.94);' },
      { title: 'Shared', detail: 'AirDrop', count: '', style: base + ' opacity: 0.8; transform: scale(0.97);' },
      { title: 'Copied', detail: '1260 × 1064', count: '×3', style: base },
    ];
    const single = [{ title: 'Copied', detail: '1260 × 1064', count: '', style: base }];
    return { toasts: (this.props.state ?? 'stacked') === 'single' ? single : all };
  }
}
</script>
</body>
</html>
