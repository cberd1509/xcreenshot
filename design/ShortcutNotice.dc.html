<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shortcut changed (Windows)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2563eb}a:hover{color:#1d4ed8}
</style>
</helmet>
<div style="width: 440px; height: 220px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; border-radius: 12px; border: 1px solid #e4e4e7; background: #ffffff; box-shadow: 0 12px 32px rgba(0,0,0,0.18); font-family: Inter, system-ui, sans-serif; color: #09090b;">
  <div style="display: flex; gap: 16px; align-items: flex-start;">
    <svg role="img" aria-label="xcreenshot" width="48" height="48" viewBox="0 0 256 256" style="flex-shrink: 0;">
      <rect x="8" y="8" width="240" height="240" rx="56" fill="#18181b"></rect>
      <g transform="translate(56 56) scale(6)" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0"></path>
        <path d="m14.31 8 5.74 9.94"></path><path d="M9.69 8h11.48"></path><path d="m7.38 12 5.74-9.94"></path>
        <path d="M9.69 16 3.95 6.06"></path><path d="M14.31 16H2.83"></path><path d="m16.62 12-5.74 9.94"></path>
      </g>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 15px; font-weight: 600;">Shortcut changed</h1>
      <p style="margin: 0; font-size: 13px; line-height: 20px; color: #52525b;">{{reason}}</p>
      <div style="display: flex; gap: 4px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;">
        <span style="padding: 2px 7px; border-radius: 5px; background: #f4f4f5; border: 1px solid #e4e4e7;">Ctrl</span>
        <span style="padding: 2px 7px; border-radius: 5px; background: #f4f4f5; border: 1px solid #e4e4e7;">Shift</span>
        <span style="padding: 2px 7px; border-radius: 5px; background: #f4f4f5; border: 1px solid #e4e4e7;">PrtSc</span>
      </div>
    </div>
  </div>
  <div style="flex-grow: 1;"></div>
  <div style="display: flex; gap: 8px; justify-content: flex-end;">
    <button style="height: 36px; padding: 0 14px; border: 1px solid #e4e4e7; border-radius: 8px; background: #ffffff; font-family: inherit; font-size: 13px; font-weight: 500; color: #09090b;">Open Settings</button>
    <button style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #18181b; font-family: inherit; font-size: 13px; font-weight: 500; color: #fafafa;">OK</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reason":{"editor":"enum","options":["Snipping Tool","Another app"],"default":"Snipping Tool"},"$preview":{"width":440,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const snipping = (this.props.reason ?? 'Snipping Tool') === 'Snipping Tool';
    return {
      reason: snipping
        ? 'PrintScreen opens Snipping Tool, so xcreenshot uses the shortcut below. You can change it in Settings.'
        : 'Another app is using PrintScreen, so xcreenshot uses the shortcut below. You can change it in Settings.',
    };
  }
}
</script>
</body>
</html>
