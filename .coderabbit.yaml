# CodeRabbit AI review: advisory only, not a required check. Conventions live in CLAUDE.md.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: 'Be brief and specific. Skip praise and style nits that Oxlint, Prettier, rustfmt or clippy already catch.'
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames: ['dependabot[bot]']
  path_filters:
    - '!src/lib/components/ui/**'
    - '!pnpm-lock.yaml'
    - '!src-tauri/Cargo.lock'
    - '!src-tauri/icons/**'
    - '!src-tauri/gen/**'
    - '!CHANGELOG.md'
  path_instructions:
    - path: 'src-tauri/src/**/*.rs'
      instructions: >-
        Check cfg(target_os) guards keep Windows compiling, that pure logic stays separate from
        OS calls and has unit tests, and that nothing slows the hotkey-to-overlay path.
    - path: 'src/**/*.{ts,svelte}'
      instructions: 'Svelte 5 runes and strict TypeScript. UI copy must be short and plain.'
    - path: '.github/**'
      instructions: 'Actions must be pinned to a commit SHA with a version comment.'
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns: ['CLAUDE.md', 'CONTRIBUTING.md']
chat:
  auto_reply: true
