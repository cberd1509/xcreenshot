name: Feature request
description: Suggest an idea
labels: ['type:feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: design
    attributes:
      label: Design
      description: Link the artboard on the design canvas this follows, or say it needs one.
