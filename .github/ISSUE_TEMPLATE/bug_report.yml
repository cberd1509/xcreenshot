name: Bug report
description: Something isn't working
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Press ⌃⇧⌘S\n2. ..."
  - type: input
    id: version
    attributes:
      label: xcreenshot version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.2 / Windows 11 24H2
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays
      description: Number of monitors and their scaling, if relevant.
