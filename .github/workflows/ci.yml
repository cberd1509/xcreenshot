name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip the slow macOS/Windows builds when only docs or repo config changed.
  # Skipped jobs still satisfy required checks.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'src-tauri/**'
              - 'assets/**'
              - 'scripts/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: pnpm lint
      - run: pnpm check
      - name: Tests with coverage (90% minimum)
        run: pnpm coverage
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

  app:
    name: App (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # Only main saves the cache, so PRs restore one warm cache instead of filling the quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds the frontend (beforeBuildCommand) and the app with the debug profile,
      # so the test step below reuses the same compiled dependencies.
      - name: Build app (debug, no installer)
        run: pnpm tauri build --debug --no-bundle
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-llvm-cov
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov
      - name: Rust tests with coverage (90% minimum)
        if: runner.os == 'macOS'
        run: ./scripts/rust-coverage.sh

  # Single required check: passes when every job passed or was skipped on purpose.
  ci:
    name: CI result
    if: always()
    needs: [changes, lint, app]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
