name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skip the slow macOS/Windows builds when only docs or repo config changed.
  # Skipped jobs still satisfy required checks.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'src-tauri/**'
              - 'assets/**'
              - 'scripts/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm lint
      - run: pnpm check
      - name: Tests with coverage (90% minimum)
        run: pnpm coverage
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

  app:
    name: App (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only main saves the cache, so PRs restore one warm cache instead of filling the quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds the frontend (beforeBuildCommand) and the app with the debug profile,
      # so the test step below reuses the same compiled dependencies.
      - name: Build app (debug, no installer)
        run: pnpm tauri build --debug --no-bundle
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test
      - name: Install cargo-llvm-cov
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Rust tests with coverage (90% minimum)
        if: runner.os == 'macOS'
        run: ./scripts/rust-coverage.sh
