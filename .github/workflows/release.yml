name: Release

# On every push to main, Changesets keeps a "chore(release): version packages" PR up to date
# with the pending changes. Merging it bumps package.json (the only version source;
# tauri.conf.json reads it) and writes CHANGELOG.md.
# Tagging and the signed app build come with M4 (#24, #26). That release step will use a
# GitHub App token, since tags and PRs created with GITHUB_TOKEN don't trigger other workflows.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
