name: Release

# On every push to main, Changesets keeps a "chore(release): version packages" PR up to date
# with the pending changes. Merging it bumps package.json (the only version source;
# tauri.conf.json reads it) and writes CHANGELOG.md.
# Once no changesets are pending and v<version> isn't released yet, the build job makes the
# universal macOS app and DMG and uploads them to a draft GitHub Release. In parallel, the
# windows job builds the NSIS installer with a read-only token, and windows-upload adds it to the
# draft and merges its entry into latest.json, after the macOS job has written that file. The
# maintainer checks the draft and publishes it, which creates the tag (docs/releasing.md).
# Developer ID signing and notarization switch on when the APPLE_CERTIFICATE secret is set.
# Windows builds aren't code signed yet (#103).
# When a release is published, the updater-urls job points latest.json at the tag's download URLs.
# A prerelease version (1.0.0-beta.0, from Changesets pre mode) is drafted as a GitHub prerelease
# with no latest.json: releases/latest skips prereleases, and testers install betas by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only build and sign the Windows installer, from main. No release is touched.
        type: boolean
        default: false
  release:
    types: [published]

concurrency: release-${{ github.ref }}

permissions: {}

jobs:
  version:
    name: Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm changeset version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  plan:
    name: Check release
    needs: version
    if: >-
      !cancelled() && !inputs.dry-run && (github.event_name == 'workflow_dispatch' ||
      (needs.version.result == 'success' && needs.version.outputs.hasChangesets == 'false'))
    runs-on: ubuntu-latest
    # Write access only so `gh release view` can see an existing draft; it changes nothing.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: echo "::error::Run this workflow from main, not $GITHUB_REF_NAME"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 1.0.0-beta.0 and the like (Changesets pre mode).
          [[ "$version" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already tagged, nothing to build."; exit 0
          fi
          draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$draft" = false ]; then
            echo "v$version is already published, nothing to build."; exit 0
          fi
          # A draft waiting to be published is rebuilt only when the version changed or on a
          # manual run, not on every unrelated merge. The build job replaces it.
          if [ "$draft" = true ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            before=$(gh api "repos/$GH_REPO/contents/package.json?ref=$BEFORE" --jq .content \
              2> /dev/null | base64 -d | jq -r .version 2> /dev/null || true)
            if [ "$before" = "$version" ]; then
              echo "The v$version draft exists and the version didn't change, nothing to build."
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build and draft v${{ needs.plan.outputs.version }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      # Whether the release gets a latest.json: signed builds that aren't betas.
      manifest: ${{ steps.secrets.outputs.manifest }}
      release-id: ${{ steps.draft.outputs.id }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # windows-upload drops "(adding Windows)" once the installer is in.
      DRAFT_TITLE: xcreenshot __VERSION__ (adding Windows)
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      DMG: src-tauri/target/universal-apple-darwin/release/bundle/dmg/xcreenshot_${{ needs.plan.outputs.version }}_universal.dmg
      APP: src-tauri/target/universal-apple-darwin/release/bundle/macos/xcreenshot.app
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # secrets.* can't be used in `if`, so this step decides and exports what the build needs.
      # Values go through GITHUB_ENV only when signing: Tauri treats an empty APPLE_CERTIFICATE
      # as set.
      - name: Check secrets
        id: secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; updates can't be signed."; exit 1
          fi
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE is not set: unsigned test build, no latest.json."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "manifest=false" >> "$GITHUB_OUTPUT"
            # Ad-hoc signature: without one Gatekeeper calls the downloaded app "damaged".
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          missing=""
          for name in APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::APPLE_CERTIFICATE is set but these secrets are missing:$missing"; exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          {
            # The Tauri bundler imports the certificate into a temporary keychain itself.
            echo "APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          # A beta has no latest.json, so even one published by mistake as a full release
          # updates no one.
          [ "$PRERELEASE" = true ] && manifest=false || manifest=true
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release-universal

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          SIGNED: ${{ steps.secrets.outputs.signed }}
        run: |
          flags=()
          [ "$SIGNED" = true ] || flags+=(--unsigned)
          {
            echo 'body<<END_OF_NOTES'
            node scripts/release.ts notes "$VERSION" "${flags[@]}"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      # Checked again right before building, since the maintainer may have published it meanwhile.
      # A published release is never touched. A failed rebuild leaves no draft until the next run.
      - name: Remove the existing draft
        id: start
        run: |
          draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$draft" = false ]; then
            echo "::error::v$VERSION was published while this run was starting; not rebuilding it."
            exit 1
          fi
          if [ "$draft" = true ]; then
            echo "Deleting the existing v$VERSION draft to rebuild it from this commit."
            gh release delete "v$VERSION" --yes
          fi
          echo "started=true" >> "$GITHUB_OUTPUT"

      # Builds, signs and notarizes the app (when signing), signs the updater bundle, then creates
      # the draft release and uploads the DMG, .app.tar.gz, .sig and (signed builds only) latest.json
      # with the macOS entries. The windows-upload job adds the Windows entries afterwards.
      # Tauri skips the Finder step that lays out the DMG window when CI=true;
      # TAURI_BUNDLER_DMG_IGNORE_CI keeps it.
      - name: Build and upload (custom DMG window)
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        with:
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: v__VERSION__
          releaseName: ${{ env.DRAFT_TITLE }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE }}
          uploadUpdaterJson: ${{ steps.secrets.outputs.manifest == 'true' }}

      # The Finder layout step can time out on hosted runners. If the app was built but the DMG
      # wasn't, retry once with the default DMG window. Any other failure stops here.
      - name: Check build result
        id: layout
        if: steps.build.outcome == 'failure'
        run: |
          if [ -d "$APP" ] && [ ! -f "$DMG" ]; then
            echo "::warning::DMG layout step failed; retrying with the default DMG window."
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Build failed before or after the DMG step; see the step above."; exit 1
          fi

      - name: Build and upload (default DMG window)
        if: steps.layout.outputs.retry == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: v__VERSION__
          releaseName: ${{ env.DRAFT_TITLE }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE }}
          uploadUpdaterJson: ${{ steps.secrets.outputs.manifest == 'true' }}

      - name: Report DMG layout
        env:
          RETRIED: ${{ steps.layout.outputs.retry }}
        run: |
          if [ "$RETRIED" = true ]; then
            echo "::notice::DMG uses the default window (the Finder layout step failed)."
          else
            echo "::notice::DMG uses the custom window layout."
          fi

      # Tauri notarizes and staples the .app but not the DMG around it.
      - name: Notarize and staple the DMG
        if: steps.secrets.outputs.signed == 'true'
        run: |
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          gh release upload "v$VERSION" "$DMG" --clobber

      # windows-upload works only on this exact release, so a newer run's draft is never touched.
      - name: Record the draft
        id: draft
        run: |
          id=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq "[.[] | select(.draft and .tag_name == \"v$VERSION\")][0].id // empty")
          [ -n "$id" ] || { echo "::error::No v$VERSION draft after the build."; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Don't leave a half-built draft (e.g. a DMG that failed notarization) for someone to publish.
      # Only drafts this run may have created; a published release is never deleted.
      - name: Delete the unfinished draft
        if: (failure() || cancelled()) && steps.start.outputs.started == 'true'
        run: |
          draft=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null || true)
          if [ "$draft" = true ]; then gh release delete "v$VERSION" --yes; fi

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  # Builds the NSIS installer and signs it for the updater, with a read-only token: it never
  # touches the release. A dry run (workflow_dispatch with dry-run) builds main this way and
  # uploads nothing. Only main: the build has the updater key, so it never runs unreviewed code.
  # To try a branch, use windows-test.yml, which has no secrets.
  windows:
    name: Build the Windows installer
    needs: plan
    if: >-
      !cancelled() && (inputs.dry-run ||
      (needs.plan.result == 'success' && needs.plan.outputs.build == 'true'))
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Only build from main
        if: github.ref != 'refs/heads/main'
        run: echo "::error::Run this workflow from main, not $GITHUB_REF_NAME"; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release-windows

      # createUpdaterArtifacts (tauri.conf.json) writes <installer>.exe.sig next to the installer,
      # signed with the same updater key as the macOS build.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; updates can't be signed."; exit 1
          fi
          pnpm tauri build --bundles nsis

      - name: Check the installer
        run: |
          exe="xcreenshot_$(node -p "require('./package.json').version")_x64-setup.exe"
          mkdir -p out
          for file in "$exe" "$exe.sig"; do
            path="src-tauri/target/release/bundle/nsis/$file"
            if [ ! -s "$path" ]; then
              echo "::error::Missing $path"; ls src-tauri/target/release/bundle/nsis; exit 1
            fi
            cp "$path" out/
          done
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.dry-run }}
        with:
          name: windows-installer
          path: out/
          if-no-files-found: error
          # Long enough to re-run a failed windows-upload without rebuilding.
          retention-days: 30

  # Runs no code from the build: adds the installer, its .sig and the Windows latest.json entries
  # to this run's macOS draft (by release id), then drops "(adding Windows)" from its title.
  # If Windows fails the draft stays and the run fails; "Re-run failed jobs" finishes it, and
  # re-running is safe. Before every write it checks the release is still this run's draft.
  # See docs/releasing.md.
  windows-upload:
    name: Add Windows to the v${{ needs.plan.outputs.version }} draft
    needs: [plan, build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MANIFEST: ${{ needs.build.outputs.manifest }}
      RELEASE_ID: ${{ needs.build.outputs.release-id }}
      WINDOWS: ${{ needs.windows.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the Windows build
        run: |
          if [ "$WINDOWS" != success ]; then
            echo "::error::The Windows build didn't succeed ($WINDOWS)."; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: out

      # Unsigned macOS test builds and betas have no latest.json, so the updater offers neither OS.
      # The merge happens first so the writes come together, each right after a check.
      - name: Add Windows to the draft and latest.json
        id: add
        run: |
          # Is release $RELEASE_ID still a draft? Stops the job if not. A failed API call (other
          # than 404) is left to the "Re-run the failed jobs" advice.
          own_draft() {
            local draft err="$RUNNER_TEMP/gh.err"
            draft=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .draft 2> "$err") || true
            [ "$draft" = true ] && return 0
            if [ "$draft" = false ]; then
              echo "stop=true" >> "$GITHUB_OUTPUT"
              echo "::error::v$VERSION was published ${1:-before Windows was added}; see docs/releasing.md."
            elif grep -q 'HTTP 404' "$err"; then
              echo "stop=true" >> "$GITHUB_OUTPUT"
              echo "::error::This run's v$VERSION draft is gone (a newer run replaced it?)."
            else
              cat "$err" >&2
            fi
            exit 1
          }
          exe="out/xcreenshot_${VERSION}_x64-setup.exe"
          files=("$exe" "$exe.sig")
          own_draft
          if [ "$MANIFEST" = true ]; then
            dir="$RUNNER_TEMP/updater"
            mkdir -p "$dir/merged"
            gh release download "v$VERSION" --pattern latest.json --dir "$dir"
            node scripts/release.ts add-windows "$dir/latest.json" "$exe.sig" "$GH_REPO" \
              "v$VERSION" > "$dir/merged/latest.json"
            jq -e '.platforms | has("darwin-aarch64") and has("windows-x86_64")' \
              "$dir/merged/latest.json" > /dev/null
            files+=("$dir/merged/latest.json")
          fi
          own_draft
          gh release upload "v$VERSION" "${files[@]}" --clobber
          own_draft
          gh release edit "v$VERSION" --title "xcreenshot $VERSION"
          # A publish during the writes isn't caught by the checks above; at least report it.
          own_draft "while Windows was being added: check its latest.json"

      - name: Explain what to do
        if: failure() && steps.add.outputs.stop != 'true'
        run: |
          echo "::error::Windows wasn't added to the v$VERSION draft. Re-run the failed jobs;" \
            "don't publish while its title says (adding Windows)."

  # tauri-action writes GitHub API asset URLs into latest.json, but the app only downloads from
  # https://github.com/<repo>/releases/download/ (src-tauri/src/updates.rs). Once the release is
  # published its tag exists, so rewrite each URL to the tag download URL of the same asset.
  # Drafts are invisible to releases/latest, so the updater can only see the original file for
  # the few seconds between publishing and this job finishing. The Windows entries already use the
  # tag URL and are kept as they are.
  updater-urls:
    name: Point latest.json at the tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only to rebuild the landing page after fixing the prerelease flag.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_ID: ${{ github.event.release.id }}
    steps:
      # A beta marked as a full release would become releases/latest; a stable one marked as a
      # prerelease would never reach the updater. Fix the flag, then rebuild the landing page:
      # pages.yml's own rebuild on this event may have read releases/latest before the fix.
      - name: Match the prerelease flag to the version
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$TAG" == *-* ]] && beta=true || beta=false
          [ "$PRERELEASE" = "$beta" ] && exit 0
          [ "$beta" = true ] && latest=false || latest=true
          echo "::warning::$TAG was published with the wrong prerelease flag; setting it to $beta."
          gh release edit "$TAG" --prerelease="$beta" --latest="$latest"
          gh workflow run pages.yml --ref "$BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Unsigned macOS test builds (notes with UNSIGNED_MARKER, scripts/release.ts) and betas have
      # no latest.json. A signed release without one fails: nothing would update.
      - env:
          BODY: ${{ github.event.release.body }}
        run: |
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx latest.json; then
            if [[ "$BODY" == *"<!-- xcreenshot:unsigned -->"* || "$TAG" == *-* ]]; then
              echo "No latest.json on $TAG (unsigned build or beta), nothing to rewrite."; exit 0
            fi
            # Reported here, failed after the Windows check so both problems show.
            echo "::error::$TAG is a signed release with no latest.json; see docs/releasing.md."
            echo "NO_MANIFEST=1" >> "$GITHUB_ENV"; exit 0
          fi
          gh release download "$TAG" --pattern latest.json --dir "$dir"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '[.[] | {id, name}]' > "$dir/assets.json"
          node scripts/release.ts updater-urls "$dir/latest.json" "$dir/assets.json" \
            "$GH_REPO" "$TAG" > "$dir/rewritten.json"
          mv "$dir/rewritten.json" "$dir/latest.json"
          cat "$dir/latest.json"
          gh release upload "$TAG" "$dir/latest.json" --clobber

      # The macOS updates above still work, but say loudly that Windows is missing.
      - name: Check Windows was added
        run: |
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -q '_x64-setup\.exe$'; then
            echo "::error::$TAG was published without the Windows installer; see docs/releasing.md."
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/updater/latest.json" ] \
            && ! jq -e '.platforms | has("windows-x86_64")' "$RUNNER_TEMP/updater/latest.json"; then
            echo "::error::$TAG's latest.json has no Windows entry; see docs/releasing.md."
            exit 1
          fi
          [ -z "${NO_MANIFEST:-}" ]
