name: Release

# On every push to main, Changesets keeps a "chore(release): version packages" PR up to date
# with the pending changes. Merging it bumps package.json (the only version source;
# tauri.conf.json reads it) and writes CHANGELOG.md.
# That version bump then triggers build-release.yml, which builds the DMG and drafts the GitHub
# Release. Publishing the draft creates the tag (docs/releasing.md).

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
