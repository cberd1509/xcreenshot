name: Windows test build

# Builds the Windows installer from any branch or commit and uploads it to a GitHub draft
# release, so it can be tried on a Windows machine without cloning the repo.
# A draft sends no notifications, fires no release events, isn't counted by the release badge
# and is visible only to people with access to the repo. It is a test build: unsigned
# (SmartScreen asks once), no updater files.
# The build job runs the branch's code with a read-only token; only the upload job, which runs
# no code from the branch, can write.
# Run it from the Actions tab or: gh workflow run windows-test.yml -f ref=<branch>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (it needs .github/actions/setup)
        required: true
        default: main

permissions: {}

jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: windows-test

      - name: Build
        shell: bash
        run: |
          # The cache can bring back an installer from an earlier build.
          rm -rf src-tauri/target/release/bundle/nsis
          pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Name the installer
        id: meta
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./package.json').version")
          mapfile -t found < <(find src-tauri/target/release/bundle/nsis -name '*-setup.exe')
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected one installer, found ${#found[@]}."; exit 1
          fi
          mkdir -p out
          cp "${found[0]}" "out/xcreenshot_${version}-test-${sha:0:12}_x64-setup.exe"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: out/*.exe
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload the draft
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One upload at a time, whatever ref string named the commit.
    concurrency: windows-test-upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF: ${{ inputs.ref }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: out
      - name: Create or update the draft
        run: |
          tag="windows-test-${SHA:0:12}"
          {
            echo "Test build of \`$REF\` at $SHA, for trying xcreenshot on Windows. Not a release."
            echo
            echo "- Unsigned: Windows SmartScreen will ask once. Click **More info › Run anyway**."
            echo "- It doesn't update itself. Uninstall it from Settings › Apps when you're done."
          } > notes.md
          # Replace the file in place rather than deleting the draft, so a failed upload never
          # leaves the earlier installer gone.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/*.exe --clobber
          else
            gh release create "$tag" out/*.exe --draft --target "$SHA" \
              --title "Windows test build: $REF (${SHA:0:12})" --notes-file notes.md
          fi
          echo "::notice::Draft $tag is ready: https://github.com/$GH_REPO/releases"
