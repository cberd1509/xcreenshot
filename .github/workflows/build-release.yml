name: Build release

# Builds the universal macOS app and DMG, then creates a draft GitHub Release v<version> with the
# DMG, the signed updater bundle and latest.json. The maintainer checks the draft and publishes it,
# which also creates the tag.
# Runs when the "version packages" PR merges (package.json version changed on main), or by hand.
# Developer ID signing and notarization switch on once the APPLE_* secrets exist (docs/releasing.md).

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (defaults to package.json's version; must match it)
        required: false
        type: string

concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: version
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
              echo "::error::Input $INPUT_VERSION doesn't match package.json ($version) on $GITHUB_REF_NAME"
              exit 1
            fi
          else
            previous=$(git show HEAD^:package.json | jq -r .version)
            if [ "$previous" = "$version" ]; then
              echo "Version unchanged ($version), nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build and draft v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUNDLE: src-tauri/target/universal-apple-darwin/release/bundle
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # secrets.* can't be used in `if`, so check them here and gate the signing steps on the output.
      - name: Check for Apple signing secrets
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] &&
             [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple signing secrets not set: building an unsigned test build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Ad-hoc signature: without it Gatekeeper calls the downloaded app "damaged".
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # https://v2.tauri.app/distribute/sign/macos/#signing-in-cicd
      - name: Import Developer ID certificate and API key
        if: steps.apple.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          keychain_password=$(openssl rand -base64 32)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/certificate.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE"; exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      # Signs and notarizes the .app and DMG when APPLE_SIGNING_IDENTITY and the API key are set.
      # TAURI_SIGNING_* sign the updater bundle (.app.tar.gz + .sig).
      - name: Build universal app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri skips the Finder step that lays out the DMG window when CI=true; keep it.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Collect release files
        env:
          SIGNED: ${{ steps.apple.outputs.signed }}
          REPO: ${{ github.repository }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$BUNDLE/dmg/xcreenshot_${VERSION}_universal.dmg" "$out/"
          tarball="xcreenshot_${VERSION}_universal.app.tar.gz"
          cp "$BUNDLE/macos/xcreenshot.app.tar.gz" "$out/$tarball"
          cp "$BUNDLE/macos/xcreenshot.app.tar.gz.sig" "$out/$tarball.sig"
          url="https://github.com/$REPO/releases/download/v$VERSION/$tarball"
          flags=()
          [ "$SIGNED" = true ] || flags+=(--unsigned)
          node scripts/release.ts "$VERSION" "$url" "$out/$tarball.sig" "$out" "${flags[@]}"
          mv "$out/notes.md" "$RUNNER_TEMP/notes.md"
          ls -la "$out"

      - name: Create or update the draft release
        run: |
          files=("$RUNNER_TEMP"/release/*)
          if state=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$state" != true ]; then
              echo "::error::Release v$VERSION is already published"; exit 1
            fi
            gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" "${files[@]}" --draft --target "$GITHUB_SHA" \
              --title "xcreenshot $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Remove signing files
        if: always() && steps.apple.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
